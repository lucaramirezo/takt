# takt production stack on vpsus (same infra pattern as KULT).
# Secrets live on the box at /etc/takt/*.env (mode 600), never committed.
name: takt
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: /etc/takt/postgres.env
    environment:
      POSTGRES_DB: takt
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d takt']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: takt-api:latest
    restart: unless-stopped
    env_file: /etc/takt/api.env
    environment:
      NODE_ENV: production
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddydata:
  caddyconfig:
